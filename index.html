<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Telegram Market</title>
<!-- IMPORTANT: set API_URL below to your deployed Python backend URL. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0f16;--card:#131a24;--card2:#182230;--text:#f4f7fb;--muted:#8d9aaa;--accent:#36d399;--blue:#5b8cff;--danger:#ff647c;--line:#263244}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172235 0,#0b0f16 42%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;padding-bottom:92px}button,input,select{font:inherit}button{border:0;color:var(--text);cursor:pointer}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}.brand{font-size:22px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#a66cff);display:grid;place-items:center;font-weight:800}.balance{background:linear-gradient(135deg,#172638,#13231f);border:1px solid #284338;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 14px 40px #0003}.balance .label{color:var(--muted);font-size:13px}.balance .num{font-size:32px;font-weight:900;margin:4px 0 16px}.actions{display:flex;gap:8px}.btn{padding:12px 14px;border-radius:14px;background:var(--card2);font-weight:700}.btn.primary{background:var(--accent);color:#06120d}.btn.blue{background:var(--blue)}.btn.danger{background:var(--danger);color:#24040a}.section{margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}.section h2{font-size:18px;margin:0}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;padding:10px 14px;border-radius:13px;background:var(--card);color:var(--muted)}.tab.active{background:var(--blue);color:#fff}.search{width:100%;background:var(--card);border:1px solid var(--line);color:#fff;padding:13px 15px;border-radius:15px;outline:none;margin:10px 0}.grid{display:grid;gap:10px}.lot{background:linear-gradient(145deg,#141d29,#101720);border:1px solid var(--line);border-radius:20px;padding:15px}.lothead{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:16px}.tag{font-size:11px;color:var(--accent);background:#17392e;padding:5px 8px;border-radius:9px}.price{font-size:22px;font-weight:900;margin:14px 0 3px}.meta{font-size:12px;color:var(--muted)}.lot .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.empty{text-align:center;padding:32px 15px;color:var(--muted);background:var(--card);border-radius:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d131ceF;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px;gap:6px}.nav button{background:transparent;color:var(--muted);padding:7px 2px;border-radius:12px;font-size:11px}.nav button.active{background:var(--card2);color:#fff}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:#111923;border-radius:25px 25px 0 0;border:1px solid var(--line);width:100%;max-width:760px;margin:auto;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;color:#fff;outline:none}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#202b39;border:1px solid var(--line);padding:12px 16px;border-radius:14px;display:none;z-index:20}.toast.show{display:block}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);padding:15px;border-radius:17px}.stat b{font-size:21px;display:block;margin-top:5px}
</style></head>
<body><div id="app" class="wrap"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div class="bottom"><div class="nav"><button data-page="market">🏪<br>Маркет</button><button data-page="auctions">⚡<br>Аукционы</button><button data-page="sell">➕<br>Продать</button><button data-page="profile">👤<br>Профиль</button></div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const state={data:null,page:'market',query:'',tab:'all'};
const app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
const API_URL = 'hhttps://unpack-composed-reaction.ngrok-free.dev';
async function api(path,opts={}){const r=await fetch(API_URL+path,{headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},...opts});const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j}
async function load(){try{state.data=await api('/api/data');render()}catch(e){toast(e.message);app.innerHTML='<div class="empty">Не удалось загрузить данные.<br><br>Откройте приложение через кнопку в Telegram.</div>'}}
function nav(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);b.onclick=()=>{state.page=b.dataset.page;render()}})}
function header(){const u=state.data.user||{};const name=u.username?('@'+esc(u.username)):'Пользователь';return `<div class="top"><div class="brand">Telegram Market<small>${name}</small></div><div class="avatar">${esc((u.username||'U')[0]).toUpperCase()}</div></div>`}
function balance(){return `<div class="balance"><div class="label">Ваш баланс</div><div class="num">${state.data.balance||0} ⭐</div><div class="actions"><button class="btn primary" onclick="openTopup()">Пополнить</button><button class="btn" onclick="openWithdraw()">Вывести</button></div></div>`}
function lotCard(x,auction=false){const price=auction?(x.auction_current_bid||x.price):(x.price);return `<div class="lot"><div class="lothead"><div><div class="title">${esc(x.title||x.username||'Без названия')}</div><div class="meta">@${esc(x.username||'unknown')}</div></div><span class="tag">${auction?'АУКЦИОН':'ПРОДАЖА'}</span></div><div class="price">${price} ⭐</div><div class="meta">Продавец: ID ${x.seller_id||'—'}</div><div class="row"><button class="btn ${auction?'blue':'primary'}" onclick="${auction?`openBid(${x.id})`:`buy(${x.id})`}">${auction?'Сделать ставку':'Купить'}</button><span class="meta">ID #${x.id}</span></div></div>`}
function market(){let a=state.data.channels||[];a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(state.query.toLowerCase()));return `${balance()}<div class="section"><h2>Маркет</h2><span class="muted">${a.length} лотов</span></div><input class="search" placeholder="🔎 Поиск username или канала" value="${esc(state.query)}" oninput="state.query=this.value;render()"><div class="grid">${a.length?a.map(x=>lotCard(x)).join(''):'<div class="empty">Активных лотов пока нет</div>'}</div>`}
function auctions(){const a=state.data.auctions||[];return `${balance()}<div class="section"><h2>⚡ Аукционы</h2><span class="muted">${a.length}</span></div><div class="grid">${a.length?a.map(x=>lotCard(x,true)).join(''):'<div class="empty">Активных аукционов пока нет</div>'}</div>`}
function profile(){const u=state.data.user||{};return `${balance()}<div class="section"><h2>Профиль</h2></div><div class="statgrid"><div class="stat">ID<b>${u.id||'—'}</b></div><div class="stat">Username<b>${u.username?'@'+esc(u.username):'—'}</b></div><div class="stat">Куплено<b>${u.total_spent||0} ⭐</b></div><div class="stat">Продано<b>${u.total_earned||0} ⭐</b></div></div><div class="section"><h2>Мои объявления</h2></div><div class="grid">${(state.data.my_lots||[]).length?state.data.my_lots.map(x=>lotCard(x)).join(''):'<div class="empty">У вас нет активных объявлений</div>'}</div>`}
function sell(){return `${balance()}<div class="section"><h2>Выставить username</h2></div><div class="lot"><div class="field"><label>Ссылка на канал</label><input id="sellLink" placeholder="https://t.me/channel"></div><div class="field"><label>Цена в Stars</label><input id="sellPrice" type="number" min="5" placeholder="100"></div><div class="field"><label>Тип продажи</label><select id="sellType"><option value="fixed">Фиксированная цена</option><option value="auction">Аукцион</option></select></div><button class="btn primary" style="width:100%" onclick="sellLot()">Выставить на продажу</button></div>`}
function render(){if(!state.data)return;let content=state.page==='market'?market():state.page==='auctions'?auctions():state.page==='sell'?sell():profile();app.innerHTML=header()+content;nav()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function modal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function openTopup(){modal(`<h2>Пополнение баланса</h2><div class="field"><label>Количество Stars</label><input id="topupAmount" type="number" min="1" placeholder="100"></div><button class="btn primary" style="width:100%" onclick="topup()">Создать счёт</button><br><br><button class="btn" style="width:100%" onclick="closeModal()">Отмена</button>`)}
function openWithdraw(){modal(`<h2>Вывод Stars</h2><div class="field"><label>Количество Stars</label><input id="withdrawAmount" type="number" min="50" placeholder="50"></div><button class="btn primary" style="width:100%" onclick="withdraw()">Создать заявку</button><br><br><button class="btn" style="width:100%" onclick="closeModal()">Отмена</button>`)}
async function buy(id){if(!confirm('Купить этот лот?'))return;try{const j=await api('/api/buy',{method:'POST',body:JSON.stringify({channel_id:id})});toast(j.message||'Покупка создана');await load()}catch(e){toast(e.message)}}
function openBid(id){modal(`<h2>Сделать ставку</h2><div class="field"><label>Сумма ставки</label><input id="bidAmount" type="number" min="1" placeholder="101"></div><button class="btn blue" style="width:100%" onclick="bid(${id})">Сделать ставку</button><br><br><button class="btn" style="width:100%" onclick="closeModal()">Отмена</button>`)}
async function bid(id){try{const j=await api('/api/bid',{method:'POST',body:JSON.stringify({channel_id:id,amount:Number(document.getElementById('bidAmount').value)})});toast(j.message||'Ставка принята');closeModal();await load()}catch(e){toast(e.message)}}
async function topup(){try{const j=await api('/api/topup',{method:'POST',body:JSON.stringify({amount:Number(document.getElementById('topupAmount').value)})});closeModal();toast('Счёт отправлен в Telegram');if(j.invoice_link)tg?.openTelegramLink(j.invoice_link)}catch(e){toast(e.message)}}
async function withdraw(){try{const j=await api('/api/withdraw',{method:'POST',body:JSON.stringify({amount:Number(document.getElementById('withdrawAmount').value)})});closeModal();toast(j.message||'Заявка создана');await load()}catch(e){toast(e.message)}}
async function sellLot(){try{const j=await api('/api/sell',{method:'POST',body:JSON.stringify({channel:document.getElementById('sellLink').value,price:Number(document.getElementById('sellPrice').value),type:document.getElementById('sellType').value})});toast(j.message||'Лот выставлен');state.page='profile';await load()}catch(e){toast(e.message)}}
load();
</script></body></html>
