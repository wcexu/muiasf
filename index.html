<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Username Market</title>
    
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --primary: #0f3460;
            --accent: #e94560;
            --success: #00d2ff;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --border-radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-balance {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header-balance span {
            color: var(--success);
            font-size: 16px;
        }

        /* Табы */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: var(--border-radius);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: fit-content;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 4px 12px rgba(15, 52, 96, 0.4);
        }

        .tab-btn:active {
            transform: scale(0.95);
        }

        /* Карточки */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--success);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .card-username {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-auction {
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
        }

        .badge-fixed {
            background: rgba(0, 210, 255, 0.2);
            color: var(--success);
        }

        /* Кнопки */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #1a4a7a);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #00b4d8);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            margin-bottom: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 8px;
        }

        .modal-footer .btn {
            flex: 1;
        }

        /* Формы */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--success);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        /* Список */
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-weight: 600;
            font-size: 14px;
        }

        .list-item-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .list-item-right {
            text-align: right;
            flex-shrink: 0;
        }

        .list-item-price {
            font-weight: 700;
            color: var(--success);
            font-size: 14px;
        }

        /* Статус */
        .status-pending {
            color: #f39c12;
        }

        .status-completed {
            color: var(--success);
        }

        .status-cancelled {
            color: var(--accent);
        }

        /* Скелетон загрузки */
        .skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, rgba(255,255,255,0.05) 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s infinite;
            border-radius: 8px;
            height: 20px;
            margin-bottom: 8px;
        }

        @keyframes skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-bottom: 70px;
            }

            .header-title {
                font-size: 18px;
            }

            .header-balance {
                font-size: 12px;
                padding: 6px 12px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 8px 12px;
            }

            .card-title {
                font-size: 14px;
            }

            .card-price {
                font-size: 18px;
            }
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        /* Тост-уведомления */
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 8px;
            border-left: 4px solid var(--success);
            box-shadow: var(--shadow);
            animation: toastIn 0.3s ease;
        }

        .toast.error {
            border-left-color: var(--accent);
        }

        @keyframes toastIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .profile-stat {
            text-align: center;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }

        .profile-stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--success);
        }

        .profile-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="header-title">🎯 Маркет</div>
        <div class="header-balance">
            ⭐ <span id="balance">0</span>
        </div>
    </div>

    <!-- Табы -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="market" onclick="switchTab('market')">🏪 Маркет</button>
        <button class="tab-btn" data-tab="auctions" onclick="switchTab('auctions')">🔨 Аукционы</button>
        <button class="tab-btn" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
        <button class="tab-btn" data-tab="sell" onclick="switchTab('sell')">📤 Продать</button>
    </div>

    <!-- Контент -->
    <div id="content">
        <!-- Маркет -->
        <div id="tab-market" class="tab-content">
            <div id="market-list"></div>
        </div>

        <!-- Аукционы -->
        <div id="tab-auctions" class="tab-content" style="display:none;">
            <div id="auction-list"></div>
        </div>

        <!-- Профиль -->
        <div id="tab-profile" class="tab-content" style="display:none;">
            <div id="profile-content"></div>
        </div>

        <!-- Продать -->
        <div id="tab-sell" class="tab-content" style="display:none;">
            <div id="sell-content"></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modal-title">Заголовок</div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <!-- Контейнер для тостов -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // API URL для взаимодействия с ботом (через Telegram WebApp)
        const API_URL = 'https://your-bot-domain.com/api'; // Замените на ваш реальный URL

        // Состояние
        let state = {
            user: null,
            balance: 0,
            channels: [],
            auctions: [],
            deals: [],
            loading: false
        };

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            // Получаем данные пользователя из Telegram
            const user = tg.initDataUnsafe?.user;
            if (user) {
                state.user = user;
                loadUserData();
            } else {
                showToast('Ошибка авторизации', 'error');
            }

            // Настройка главной кнопки
            tg.MainButton.text = 'Обновить';
            tg.MainButton.onClick(() => {
                loadUserData();
                showToast('🔄 Обновлено');
            });
            tg.MainButton.show();
        });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ
        // ============================================================

        async function loadUserData() {
            if (state.loading) return;
            state.loading = true;
            
            try {
                // Здесь должен быть реальный API запрос к вашему боту
                // Пока используем тестовые данные
                const mockData = await getMockData();
                
                state.balance = mockData.balance;
                state.channels = mockData.channels;
                state.auctions = mockData.auctions;
                
                updateUI();
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Ошибка загрузки данных', 'error');
            } finally {
                state.loading = false;
            }
        }

        // ============================================================
        // МОК-ДАННЫЕ (ЗАМЕНИТЬ НА РЕАЛЬНЫЙ API)
        // ============================================================

        function getMockData() {
            return {
                balance: 2450,
                channels: [
                    { id: 1, title: 'Crypto News', username: 'crypto_news', price: 500, type: 'fixed', seller_id: 12345 },
                    { id: 2, title: 'Tech Updates', username: 'tech_updates', price: 750, type: 'fixed', seller_id: 67890 },
                    { id: 3, title: 'Gaming Channel', username: 'gaming_ch', price: 300, type: 'fixed', seller_id: 11111 },
                ],
                auctions: [
                    { id: 4, title: 'Premium Channel', username: 'premium_ch', price: 1000, current_bid: 1200, 
                      end_time: Date.now() + 86400000, bidder_id: 12345 },
                    { id: 5, title: 'NFT Community', username: 'nft_community', price: 800, current_bid: 850,
                      end_time: Date.now() + 172800000, bidder_id: null },
                ]
            };
        }

        // ============================================================
        // ОБНОВЛЕНИЕ UI
        // ============================================================

        function updateUI() {
            // Обновляем баланс
            document.getElementById('balance').textContent = state.balance;

            // Обновляем текущую вкладку
            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab) {
                const tabName = activeTab.dataset.tab;
                switchTab(tabName);
            }
        }

        // ============================================================
        // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ============================================================

        function switchTab(tabName) {
            // Обновляем кнопки
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tabName) {
                    btn.classList.add('active');
                }
            });

            // Скрываем все вкладки
            document.querySelectorAll('.tab-content').forEach(el => {
                el.style.display = 'none';
            });

            // Показываем нужную
            const target = document.getElementById(`tab-${tabName}`);
            if (target) {
                target.style.display = 'block';
            }

            // Загружаем контент
            switch(tabName) {
                case 'market':
                    renderMarket();
                    break;
                case 'auctions':
                    renderAuctions();
                    break;
                case 'profile':
                    renderProfile();
                    break;
                case 'sell':
                    renderSell();
                    break;
            }
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ МАРКЕТА
        // ============================================================

        function renderMarket() {
            const container = document.getElementById('market-list');
            
            if (state.channels.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛒</div>
                        <div class="empty-state-title">Нет товаров</div>
                        <div>На данный момент нет username на продаже</div>
                    </div>
                `;
                return;
            }

            let html = '';
            state.channels.forEach(channel => {
                html += `
                    <div class="card" onclick="viewChannel(${channel.id}, 'fixed')">
                        <div class="card-title">${channel.title}</div>
                        <div class="card-subtitle">@${channel.username}</div>
                        <div class="card-price">⭐ ${channel.price}</div>
                        <div class="card-footer">
                            <span class="card-username">Продавец: ${channel.seller_id}</span>
                            <span class="card-badge badge-fixed">Фикс</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ АУКЦИОНОВ
        // ============================================================

        function renderAuctions() {
            const container = document.getElementById('auction-list');

            if (state.auctions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔨</div>
                        <div class="empty-state-title">Нет аукционов</div>
                        <div>Активные аукционы отсутствуют</div>
                    </div>
                `;
                return;
            }

            let html = '';
            state.auctions.forEach(auction => {
                const timeLeft = auction.end_time ? getTimeLeft(auction.end_time) : 'Не начат';
                const hasBid = auction.bidder_id !== null;
                
                html += `
                    <div class="card" onclick="viewChannel(${auction.id}, 'auction')">
                        <div class="card-title">${auction.title}</div>
                        <div class="card-subtitle">@${auction.username}</div>
                        <div class="card-price">⭐ ${auction.current_bid || auction.price}</div>
                        <div class="card-footer">
                            <span class="card-username">⏰ ${timeLeft}</span>
                            <span class="card-badge badge-auction">Аукцион ${hasBid ? '• Есть ставки' : ''}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ ПРОФИЛЯ
        // ============================================================

        function renderProfile() {
            const container = document.getElementById('profile-content');

            const user = state.user || { id: 'Неизвестно', username: 'Гость' };

            container.innerHTML = `
                <div class="card">
                    <div class="card-title">👤 Мой профиль</div>
                    <div class="card-subtitle">ID: ${user.id || '—'}</div>
                    <div class="card-subtitle">Username: ${user.username ? '@' + user.username : 'Не указан'}</div>
                </div>

                <div class="grid-2">
                    <div class="profile-stat">
                        <div class="profile-stat-number">${state.balance}</div>
                        <div class="profile-stat-label">⭐ Баланс</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-number">${state.channels.filter(c => c.seller_id === user.id).length}</div>
                        <div class="profile-stat-label">📤 Мои лоты</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-number">0</div>
                        <div class="profile-stat-label">🛒 Куплено</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-number">0</div>
                        <div class="profile-stat-label">💰 Продано</div>
                    </div>
                </div>

                <div style="margin-top: 16px;">
                    <button class="btn btn-primary" onclick="showWithdrawModal()">💳 Вывод Stars</button>
                </div>
                <div style="margin-top: 8px;">
                    <button class="btn btn-success" onclick="showTopupModal()">💎 Пополнить баланс</button>
                </div>
            `;
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ ПРОДАЖИ
        // ============================================================

        function renderSell() {
            const container = document.getElementById('sell-content');

            container.innerHTML = `
                <div class="card">
                    <div class="card-title">📤 Продать username</div>
                    <div class="card-subtitle">Выберите способ продажи</div>
                </div>

                <button class="btn btn-primary" style="margin-bottom: 8px;" onclick="showSellModal('fixed')">
                    📢 Фиксированная цена
                </button>
                <button class="btn btn-success" onclick="showSellModal('auction')">
                    🔨 Аукцион
                </button>

                <div style="margin-top: 20px;">
                    <div class="card">
                        <div class="card-title">📋 Мои лоты</div>
                        <div id="my-lots">
                            ${state.channels.filter(c => c.seller_id === (state.user?.id || 0)).length === 0 ? 
                                '<div class="empty-state"><div class="empty-state-title">Нет активных лотов</div></div>' :
                                state.channels.filter(c => c.seller_id === (state.user?.id || 0)).map(c => `
                                    <div class="list-item">
                                        <div class="list-item-icon">📢</div>
                                        <div class="list-item-content">
                                            <div class="list-item-title">${c.title}</div>
                                            <div class="list-item-subtitle">@${c.username}</div>
                                        </div>
                                        <div class="list-item-right">
                                            <div class="list-item-price">⭐ ${c.price}</div>
                                            <button class="btn btn-danger btn-sm" onclick="removeLot(${c.id})">✕</button>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // МОДАЛЬНЫЕ ОКНА
        // ============================================================

        function openModal(title, bodyHTML, footerHTML = '') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            document.getElementById('modal-footer').innerHTML = footerHTML;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ============================================================
        // ПРОСМОТР КАНАЛА
        // ============================================================

        function viewChannel(id, type) {
            const channel = type === 'fixed' 
                ? state.channels.find(c => c.id === id)
                : state.auctions.find(c => c.id === id);

            if (!channel) {
                showToast('Канал не найден', 'error');
                return;
            }

            const isAuction = type === 'auction';
            const price = isAuction ? (channel.current_bid || channel.price) : channel.price;
            const title = isAuction ? '🔨 Аукцион' : '📢 Покупка';

            let bodyHTML = `
                <div style="margin-bottom: 12px;">
                    <strong>${channel.title}</strong>
                </div>
                <div style="color: var(--text-secondary); margin-bottom: 8px;">@${channel.username}</div>
                <div style="font-size: 24px; font-weight: 700; color: var(--success); margin-bottom: 16px;">
                    ⭐ ${price}
                </div>
            `;

            if (isAuction) {
                const timeLeft = channel.end_time ? getTimeLeft(channel.end_time) : 'Не начат';
                bodyHTML += `
                    <div style="color: var(--text-secondary); font-size: 13px;">
                        ⏰ Осталось: ${timeLeft}
                    </div>
                    <div style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">
                        👤 Лидирует: ${channel.bidder_id ? 'Есть ставка' : 'Нет ставок'}
                    </div>
                `;
            }

            let footerHTML = `
                <button class="btn ${isAuction ? 'btn-success' : 'btn-primary'}" onclick="closeModal(); ${isAuction ? `placeBid(${id})` : `confirmBuy(${id})`}">
                    ${isAuction ? '💰 Сделать ставку' : '🛒 Купить'}
                </button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `;

            openModal(title, bodyHTML, footerHTML);
        }

        // ============================================================
        // ПОКУПКА
        // ============================================================

        function confirmBuy(id) {
            closeModal();
            showToast(`🛒 Запрос на покупку #${id} отправлен`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ action: 'buy', channel_id: id }));
        }

        // ============================================================
        // СТАВКА НА АУКЦИОНЕ
        // ============================================================

        function placeBid(id) {
            closeModal();
            
            const auction = state.auctions.find(c => c.id === id);
            if (!auction) return;

            const minBid = (auction.current_bid || auction.price) + 1;
            
            openModal('💰 Сделать ставку', `
                <div style="margin-bottom: 12px;">
                    <strong>${auction.title}</strong>
                </div>
                <div style="color: var(--text-secondary); margin-bottom: 16px;">Текущая ставка: ⭐ ${auction.current_bid || auction.price}</div>
                <div class="form-group">
                    <label class="form-label">Ваша ставка (мин. ${minBid})</label>
                    <input class="form-input" type="number" id="bid-amount" value="${minBid}" min="${minBid}" step="1">
                </div>
            `, `
                <button class="btn btn-success" onclick="submitBid(${id})">✅ Подтвердить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function submitBid(id) {
            const input = document.getElementById('bid-amount');
            if (!input) return;
            
            const amount = parseInt(input.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('Введите корректную сумму', 'error');
                return;
            }

            closeModal();
            showToast(`✅ Ставка ${amount} Stars принята`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ action: 'bid', channel_id: id, amount: amount }));
        }

        // ============================================================
        // ВЫВОД СРЕДСТВ
        // ============================================================

        function showWithdrawModal() {
            openModal('💳 Вывод Stars', `
                <div class="form-group">
                    <label class="form-label">Сумма вывода (мин. 50 Stars)</label>
                    <input class="form-input" type="number" id="withdraw-amount" placeholder="Введите сумму" min="50" step="1">
                </div>
                <div style="color: var(--text-secondary); font-size: 13px;">
                    Доступно: ⭐ ${state.balance}
                </div>
            `, `
                <button class="btn btn-success" onclick="submitWithdraw()">✅ Вывести</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function submitWithdraw() {
            const input = document.getElementById('withdraw-amount');
            if (!input) return;
            
            const amount = parseInt(input.value);
            if (isNaN(amount) || amount < 50) {
                showToast('Минимальная сумма вывода: 50 Stars', 'error');
                return;
            }
            if (amount > state.balance) {
                showToast('Недостаточно средств', 'error');
                return;
            }

            closeModal();
            showToast(`📤 Заявка на вывод ${amount} Stars отправлена`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ action: 'withdraw', amount: amount }));
        }

        // ============================================================
        // ПОПОЛНЕНИЕ
        // ============================================================

        function showTopupModal() {
            openModal('💎 Пополнение баланса', `
                <div class="grid-2" style="margin-bottom: 12px;">
                    <button class="btn btn-success btn-sm" onclick="quickTopup(10)">10 ⭐</button>
                    <button class="btn btn-success btn-sm" onclick="quickTopup(50)">50 ⭐</button>
                    <button class="btn btn-success btn-sm" onclick="quickTopup(100)">100 ⭐</button>
                    <button class="btn btn-success btn-sm" onclick="quickTopup(250)">250 ⭐</button>
                </div>
                <div class="form-group">
                    <label class="form-label">Своя сумма</label>
                    <input class="form-input" type="number" id="topup-amount" placeholder="Введите сумму" min="1" step="1">
                </div>
                <div style="color: var(--text-secondary); font-size: 13px;">
                    💳 Оплата через Telegram Stars
                </div>
            `, `
                <button class="btn btn-primary" onclick="submitTopup()">💎 Пополнить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function quickTopup(amount) {
            closeModal();
            showToast(`💎 Создание счета на ${amount} Stars...`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ action: 'topup', amount: amount }));
        }

        function submitTopup() {
            const input = document.getElementById('topup-amount');
            if (!input) return;
            
            const amount = parseInt(input.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('Введите корректную сумму', 'error');
                return;
            }

            closeModal();
            showToast(`💎 Создание счета на ${amount} Stars...`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ action: 'topup', amount: amount }));
        }

        // ============================================================
        // ПРОДАЖА
        // ============================================================

        function showSellModal(type) {
            const title = type === 'fixed' ? '📢 Фиксированная цена' : '🔨 Аукцион';
            
            openModal(title, `
                <div class="form-group">
                    <label class="form-label">Ссылка на канал</label>
                    <input class="form-input" id="sell-channel" placeholder="https://t.me/username">
                </div>
                <div class="form-group">
                    <label class="form-label">${type === 'fixed' ? 'Цена (Stars)' : 'Стартовая цена (Stars)'}</label>
                    <input class="form-input" id="sell-price" type="number" placeholder="Минимум 5 Stars" min="5" step="1">
                </div>
                <div style="color: var(--text-secondary); font-size: 13px;">
                    ⚠️ Бот должен быть администратором канала
                </div>
            `, `
                <button class="btn btn-success" onclick="submitSell('${type}')">✅ Выставить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function submitSell(type) {
            const channelInput = document.getElementById('sell-channel');
            const priceInput = document.getElementById('sell-price');
            
            if (!channelInput || !priceInput) return;
            
            const channel = channelInput.value.trim();
            const price = parseInt(priceInput.value);
            
            if (!channel) {
                showToast('Введите ссылку на канал', 'error');
                return;
            }
            if (isNaN(price) || price < 5) {
                showToast('Минимальная цена: 5 Stars', 'error');
                return;
            }

            closeModal();
            showToast(`✅ Канал выставлен на ${type === 'fixed' ? 'продажу' : 'аукцион'}`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ 
            //     action: 'sell', 
            //     channel: channel, 
            //     price: price,
            //     type: type 
            // }));
        }

        // ============================================================
        // УДАЛЕНИЕ ЛОТА
        // ============================================================

        function removeLot(id) {
            if (!confirm('Снять лот с продажи?')) return;
            
            showToast(`🗑️ Лот #${id} снят с продажи`);
            
            // Здесь должен быть реальный запрос к боту
            // tg.sendData(JSON.stringify({ action: 'remove_lot', channel_id: id }));
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function getTimeLeft(timestamp) {
            const diff = timestamp - Date.now();
            if (diff <= 0) return 'Завершен';
            
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            
            if (days > 0) return `${days}д ${hours}ч`;
            if (hours > 0) return `${hours}ч ${minutes}м`;
            return `${minutes}м`;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.textContent = message;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // ОБРАБОТКА ДАННЫХ ОТ БОТА
        // ============================================================

        // Получение данных от бота через Telegram WebApp
        tg.onEvent('mainButtonClicked', () => {
            loadUserData();
        });

        // Обработка входящих данных от бота
        tg.onEvent('data', (data) => {
            try {
                const parsed = JSON.parse(data);
                if (parsed.action === 'update_balance') {
                    state.balance = parsed.balance;
                    document.getElementById('balance').textContent = state.balance;
                    showToast(`⭐ Баланс обновлен: ${parsed.balance}`);
                }
                if (parsed.action === 'update_list') {
                    if (parsed.type === 'channels') {
                        state.channels = parsed.data;
                    }
                    if (parsed.type === 'auctions') {
                        state.auctions = parsed.data;
                    }
                    updateUI();
                }
            } catch (e) {
                console.error('Error processing data:', e);
            }
        });

        // ============================================================
        // ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА ПО КЛИКУ СНАРУЖИ
        // ============================================================

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        });

        console.log('✅ Username Market App загружен!');
        console.log('👤 Пользователь:', state.user);
    </script>

</body>
</html>
