<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Username Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0e1116);--card:var(--tg-theme-secondary-bg-color,#171b22);--text:var(--tg-theme-text-color,#fff);--muted:var(--tg-theme-hint-color,#8c96a5);--accent:var(--tg-theme-button-color,#2ea6ff);--danger:#ef5350;--success:#32d583}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 88px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-weight:800;font-size:22px}.balance{background:var(--card);padding:8px 12px;border-radius:14px;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--text);white-space:nowrap}.tab.active{background:var(--accent);color:#fff}.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 18px #0002}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-weight:800;font-size:17px}.muted{color:var(--muted);font-size:13px}.price{font-weight:800}.btn{width:100%;border:0;border-radius:13px;padding:12px;margin-top:10px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#ffffff12}.btn.success{background:var(--success);color:#06130b}.btn.danger{background:var(--danger)}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff18;background:#ffffff08;color:var(--text);margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);padding:14px;border-radius:16px}.stat b{display:block;font-size:22px;margin-top:4px}.empty{text-align:center;padding:30px;color:var(--muted)}.hidden{display:none}.toast{position:fixed;left:14px;right:14px;bottom:16px;padding:12px 14px;border-radius:14px;background:#222;color:#fff;display:none;text-align:center}
</style>
</head>
<body><div class="app">
<div class="top"><div class="brand">Username Market</div><div class="balance" id="balance">⭐ —</div></div>
<div class="tabs"><button class="tab active" data-tab="market">🛒 Рынок</button><button class="tab" data-tab="auction">🔨 Аукционы</button><button class="tab" data-tab="profile">👤 Профиль</button><button class="tab" data-tab="sell">➕ Продать</button><button class="tab" data-tab="admin" id="adminTab">⚙️ Админ</button></div>
<section id="market"></section><section id="auction" class="hidden"></section><section id="profile" class="hidden"></section><section id="sell" class="hidden"></section><section id="admin" class="hidden"></section>
</div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const headers={'X-Telegram-Init-Data':tg?.initData||''}; let me=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...headers,'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'Ошибка');return d}
function money(n){return new Intl.NumberFormat('ru-RU').format(n||0)}
async function load(){try{me=await api('/api/me');$('balance').textContent=`⭐ ${money(me.user.balance)}`;renderProfile();renderSell();if(me.is_admin){$('adminTab').classList.remove('hidden');renderAdmin()}else $('adminTab').classList.add('hidden');await renderMarket();await renderAuctions()}catch(e){toast('Откройте Mini App из Telegram')} }
async function renderMarket(){let d=await api('/api/market');$('market').innerHTML=d.items.length?d.items.map(c=>card(c,false)).join(''):'<div class="empty">Нет активных объявлений</div>'}
async function renderAuctions(){let d=await api('/api/auctions');$('auction').innerHTML=d.items.length?d.items.map(c=>card(c,true)).join(''):'<div class="empty">Нет активных аукционов</div>'}
function card(c,auction){return `<div class="card"><div class="row"><div><div class="title">${esc(c.title)}</div><div class="muted">@${esc(c.username)}</div></div><div class="price">⭐ ${money(auction?(c.auction_current_bid||c.auction_start_price):c.price)}</div></div>${auction?`<div class="muted" style="margin-top:8px">Старт: ⭐ ${money(c.auction_start_price)} · Ставки доступны в боте</div>`:''}<button class="btn ${auction?'secondary':''}" onclick="${auction?`tg?.showAlert('Ставки пока доступны через интерфейс бота')`:`buy(${c.id})`}">${auction?'🔨 Сделать ставку':'🛒 Купить'}</button></div>`}
async function buy(id){if(!confirm('Купить этот username? Средства будут заблокированы до подтверждения передачи.'))return;try{let d=await api('/api/buy',{method:'POST',body:JSON.stringify({channel_id:id})});toast('Оплата прошла. Передача ожидается.');await load();}catch(e){toast(e.message)}}
function renderProfile(){let u=me.user;let deals=me.deals||[];$('profile').innerHTML=`<div class="grid"><div class="stat">Баланс<b>⭐ ${money(u.balance)}</b></div><div class="stat">Продано<b>${u.total_sold||0}</b></div><div class="stat">Куплено<b>${u.total_bought||0}</b></div><div class="stat">Потрачено<b>⭐ ${money(u.total_spent)}</b></div></div><div class="card"><div class="title">👤 Профиль</div><div class="muted" style="margin-top:8px">ID: ${u.user_id}</div><div class="muted">Username: ${u.username?'@'+esc(u.username):'нет'}</div><button class="btn" onclick="topup()">⭐ Пополнить баланс</button><button class="btn danger" onclick="withdraw()">💸 Вывести Stars</button></div><div class="card"><div class="title">📦 Мои сделки</div>${deals.length?deals.map(d=>`<div style="padding:10px 0;border-bottom:1px solid #ffffff10"><b>${esc(d.title||'Сделка')}</b><div class="muted">⭐ ${money(d.price)} · ${esc(d.status)}</div>${d.status==='waiting_transfer'&&d.buyer_id===u.user_id?`<button class="btn success" onclick="checkTransfer(${d.id})">✅ Проверить передачу</button>`:''}</div>`).join(''):'<div class="empty">Сделок пока нет</div>'}</div>`}
function renderSell(){$('sell').innerHTML=`<div class="card"><div class="title">➕ Выставить username</div><div class="muted" style="margin-top:6px">Сначала добавьте бота администратором канала.</div><input id="sellChannel" placeholder="https://t.me/channel"><input id="sellPrice" type="number" min="5" placeholder="Цена в Stars"><select id="sellAuction"><option value="0">Фиксированная цена</option><option value="1">Аукцион</option></select><button class="btn success" onclick="sell()">Выставить на продажу</button></div><div class="card"><div class="title">📋 Мои объявления</div>${(me.my_channels||[]).map(c=>`<div style="padding:10px 0;border-bottom:1px solid #ffffff10"><b>${esc(c.title)}</b><div class="muted">@${esc(c.username)} · ⭐ ${money(c.price)}</div></div>`).join('')||'<div class="empty">Нет объявлений</div>'}</div>`}
async function sell(){try{let channel=$('sellChannel').value,price=Number($('sellPrice').value),is_auction=$('sellAuction').value==='1';await api('/api/sell',{method:'POST',body:JSON.stringify({channel,price,is_auction})});toast('Username выставлен!');await load()}catch(e){toast(e.message)}}
async function topup(){let a=prompt('Сколько Stars пополнить?');if(!a)return;try{await api('/api/topup',{method:'POST',body:JSON.stringify({amount:Number(a)})});toast('Инвойс отправлен в бота. Оплатите его там.')}catch(e){toast(e.message)}}
async function withdraw(){let a=prompt('Сколько Stars вывести?');if(!a)return;try{await api('/api/withdraw',{method:'POST',body:JSON.stringify({amount:Number(a)})});toast('Заявка отправлена администратору');await load()}catch(e){toast(e.message)}}
async function checkTransfer(id){try{await api('/api/check-transfer',{method:'POST',body:JSON.stringify({deal_id:id})});toast('Передача подтверждена!');await load()}catch(e){toast(e.message)}}
async function renderAdmin(){try{let s=await api('/api/admin/stats');$('admin').innerHTML=`<div class="grid"><div class="stat">Пользователи<b>${s.users}</b></div><div class="stat">На продаже<b>${s.active_channels}</b></div><div class="stat">Сделки<b>${s.completed_deals}</b></div><div class="stat">Оборот<b>⭐ ${money(s.volume)}</b></div></div><div class="card"><div class="title">⚙️ Администрирование</div><input id="adminUser" type="number" placeholder="ID пользователя"><input id="adminAmount" type="number" placeholder="Количество Stars"><button class="btn success" onclick="giveBalance()">💰 Выдать баланс</button></div>`}catch(e){$('admin').innerHTML='<div class="empty">Нет доступа</div>'}}
async function giveBalance(){try{await api('/api/admin/give-balance',{method:'POST',body:JSON.stringify({user_id:Number($('adminUser').value),amount:Number($('adminAmount').value)})});toast('Баланс выдан')}catch(e){toast(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});
load();
</script></body></html>
