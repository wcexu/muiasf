<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Username Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --primary: #0f3460;
            --accent: #e94560;
            --success: #00d2ff;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --radius: 16px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-balance {
            background: var(--card);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .header-balance span { color: var(--success); font-size: 16px; }
        .sync-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #0f3460, #1a4a7a);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .sync-btn:active { transform: scale(0.97); }
        .sync-btn.loading { opacity: 0.7; pointer-events: none; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card);
            padding: 6px;
            border-radius: var(--radius);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 4px 12px rgba(15, 52, 96, 0.4);
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:active { transform: scale(0.98); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .card-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .card-price { font-size: 20px; font-weight: 700; color: var(--success); }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .card-username { font-size: 13px; color: var(--text-secondary); }
        .card-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-auction { background: rgba(233, 69, 96, 0.2); color: var(--accent); }
        .badge-fixed { background: rgba(0, 210, 255, 0.2); color: var(--success); }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #1a4a7a); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #00b4d8); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--accent), #c0392b); color: white; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text); }
        .btn-sm { padding: 8px 16px; font-size: 12px; width: auto; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-body { margin-bottom: 16px; }
        .modal-footer { display: flex; gap: 8px; }
        .modal-footer .btn { flex: 1; }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-input:focus { border-color: var(--success); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .profile-stat {
            text-align: center;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }
        .profile-stat-number { font-size: 24px; font-weight: 700; color: var(--success); }
        .profile-stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 8px;
            border-left: 4px solid var(--success);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: toastIn 0.3s ease;
        }
        .toast.error { border-left-color: var(--accent); }
        @keyframes toastIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .list-item-content { flex: 1; }
        .list-item-title { font-weight: 600; font-size: 14px; }
        .list-item-subtitle { font-size: 12px; color: var(--text-secondary); }
        .list-item-right { text-align: right; flex-shrink: 0; }
        .list-item-price { font-weight: 700; color: var(--success); font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 12px; padding-bottom: 70px; }
            .header-title { font-size: 18px; }
            .header-balance { font-size: 12px; padding: 6px 12px; }
            .tab-btn { font-size: 12px; padding: 8px 12px; }
            .card-title { font-size: 14px; }
            .card-price { font-size: 18px; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">🎯 Маркет</div>
        <div class="header-balance" onclick="forceSync()">
            ⭐ <span id="balance">0</span>
        </div>
    </div>

    <button class="sync-btn" id="syncBtn" onclick="forceSync()">
        🔄 Синхронизировать
    </button>

    <div class="tabs">
        <button class="tab-btn active" data-tab="market" onclick="switchTab('market')">🏪 Маркет</button>
        <button class="tab-btn" data-tab="auctions" onclick="switchTab('auctions')">🔨 Аукционы</button>
        <button class="tab-btn" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
        <button class="tab-btn" data-tab="sell" onclick="switchTab('sell')">📤 Продать</button>
    </div>

    <div id="content">
        <div id="tab-market" class="tab-content"><div id="market-list"><div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Загрузка...</div><div>Нажмите "Синхронизировать"</div></div></div></div>
        <div id="tab-auctions" class="tab-content" style="display:none;"><div id="auction-list"><div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Загрузка...</div><div>Нажмите "Синхронизировать"</div></div></div></div>
        <div id="tab-profile" class="tab-content" style="display:none;"><div id="profile-content"><div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Загрузка...</div><div>Нажмите "Синхронизировать"</div></div></div></div>
        <div id="tab-sell" class="tab-content" style="display:none;"><div id="sell-content"><div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Загрузка...</div><div>Нажмите "Синхронизировать"</div></div></div></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modal-title">Заголовок</div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // ============================================================
        // ФИКС: ЕСЛИ TELEGRAM НЕ ПЕРЕДАЛ ДАННЫЕ - ИСПОЛЬЗУЕМ ВАШ ID
        // ============================================================
        
        // ВАШ TELEGRAM ID (ЗАМЕНИТЕ НА СВОЙ!)
        const MY_USER_ID = 8102526978;
        const MY_USERNAME = 'wcexu';
        
        let user = tg.initDataUnsafe?.user;
        if (!user) {
            console.warn('⚠️ Telegram не передал данные! Используем временный ID:', MY_USER_ID);
            user = { id: MY_USER_ID, username: MY_USERNAME };
            // ВСТАВЬТЕ СВОЙ ID ВМЕСТО MY_USER_ID!
        }
        
        console.log('👤 Пользователь:', user);

        let state = {
            user: user,
            balance: 0,
            channels: [],
            auctions: [],
            loading: false,
            dataReceived: false
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (!state.user) {
                showToast('⚠️ Ошибка авторизации', 'error');
                document.getElementById('balance').textContent = '❌';
                return;
            }
            console.log('✅ Пользователь загружен:', state.user);
            tg.MainButton.text = '🔄 Обновить';
            tg.MainButton.onClick(() => forceSync());
            tg.MainButton.show();
            setTimeout(forceSync, 500);
        });

        function forceSync() {
            if (state.loading) { showToast('⏳ Уже синхронизация...'); return; }
            if (!state.user) { showToast('❌ Нет данных пользователя', 'error'); return; }
            
            state.loading = true;
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.innerHTML = '<span class="spinner"></span> Синхронизация...';
            syncBtn.classList.add('loading');
            
            showToast('🔄 Синхронизация...');
            state.channels = [];
            state.auctions = [];
            state.balance = 0;
            document.getElementById('balance').textContent = '⏳';
            
            try {
                tg.sendData(JSON.stringify({
                    action: 'get_data',
                    user_id: state.user.id,
                    timestamp: Date.now()
                }));
                console.log('📤 Запрос отправлен для user_id:', state.user.id);
            } catch (e) {
                console.error('❌ Ошибка:', e);
                showToast('❌ Ошибка отправки', 'error');
                state.loading = false;
                syncBtn.innerHTML = '🔄 Синхронизировать';
                syncBtn.classList.remove('loading');
            }

            setTimeout(() => {
                if (state.loading) {
                    state.loading = false;
                    syncBtn.innerHTML = '🔄 Синхронизировать';
                    syncBtn.classList.remove('loading');
                    if (!state.dataReceived) {
                        showToast('⚠️ Бот не отвечает. Проверьте, запущен ли бот.', 'error');
                        document.getElementById('balance').textContent = '⚠️';
                    }
                }
            }, 10000);
        }

        tg.onEvent('data', (data) => {
            try {
                const parsed = JSON.parse(data);
                console.log('📥 Ответ от бота:', parsed);
                
                state.loading = false;
                state.dataReceived = true;
                document.getElementById('syncBtn').innerHTML = '🔄 Синхронизировать';
                document.getElementById('syncBtn').classList.remove('loading');
                
                if (parsed.action === 'update_data') {
                    state.balance = parsed.balance || 0;
                    state.channels = parsed.channels || [];
                    state.auctions = parsed.auctions || [];
                    if (parsed.user) state.user = parsed.user;
                    
                    document.getElementById('balance').textContent = state.balance;
                    updateUI();
                    showToast(`✅ Синхронизация успешна! Баланс: ${state.balance} Stars`);
                } else if (parsed.action === 'action_result') {
                    if (parsed.success) {
                        showToast(`✅ ${parsed.message || 'Действие выполнено'}`);
                        setTimeout(forceSync, 1500);
                    } else {
                        showToast(`❌ ${parsed.message || 'Ошибка'}`, 'error');
                    }
                }
            } catch (e) {
                console.error('❌ Ошибка обработки:', e);
                showToast('❌ Ошибка обработки данных', 'error');
            }
        });

        function sendToBot(action, data = {}) {
            if (!state.user) { showToast('❌ Нет данных пользователя', 'error'); return; }
            try {
                tg.sendData(JSON.stringify({
                    action: action,
                    user_id: state.user.id,
                    ...data,
                    timestamp: Date.now()
                }));
                console.log(`📤 Отправка ${action}:`, data);
                showToast(`⏳ Отправка ${action}...`);
            } catch (e) {
                console.error('❌ Ошибка:', e);
                showToast('❌ Ошибка отправки', 'error');
            }
        }

        // ... остальные функции (updateUI, switchTab, renderMarket, renderAuctions, renderProfile, renderSell, viewChannel, confirmBuy, placeBid, submitBid, showWithdrawModal, submitWithdraw, showTopupModal, quickTopup, submitTopup, showSellModal, submitSell, removeLot, openModal, closeModal, getTimeLeft, showToast) ...
        
        // ВАЖНО: добавьте все остальные функции из предыдущего кода!
        // Они такие же, как были в вашем HTML.
        
        console.log('✅ Username Market App загружен!');
        console.log('👤 Пользователь:', state.user);
    </script>
</body>
</html>
